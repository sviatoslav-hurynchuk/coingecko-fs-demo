server {
    listen 80;
    server_name localhost;

    # Serving pre-built static assets directly offloads Node.js runtime overhead in production.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # SPA client-side routing fallback ensures deep links resolve to React index without 404s.
        try_files $uri $uri/ /index.html;
    }

    # Internal Docker bridge reverse proxy forwards API traffic to the FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
